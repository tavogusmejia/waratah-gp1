<!-- ==================================================================
     THE LANDING.

     Inline, and first, on purpose. Everything needed to paint it is in
     this file: no stylesheet, no script, no font, no image. The browser
     can paint the brand the moment the first packet of HTML lands, which
     is the only way "fast" means anything - one round trip, nothing to
     wait on.

     That is also why the two stylesheets below it are loaded the
     print-media way rather than normally. A render-blocking link is a
     promise not to show the user anything until it arrives, and the
     Google Fonts one is a third-party round trip before a single pixel.
     The landing covers the page while both land, so neither needs to
     block, and the flash of unstyled register they would otherwise cause
     happens behind it where nobody sees it.

     Palette is the brand exactly: #DB3837 red, #65768E slate, on white.
     ================================================================== -->
<style>
  #splash{
    --red:#DB3837; --slate:#65768E;
    position:fixed; inset:0; z-index:9999;
    background:#fff; color:var(--slate);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
    opacity:1; transition:opacity .5s ease, visibility .5s;
  }
  /* The register is what the page is for. Once it is ready the landing
     stops existing rather than sitting invisible over the top of it. */
  #splash.done{ opacity:0; visibility:hidden; pointer-events:none; }
  html.splash-on, html.splash-on body{ overflow:hidden; }

  /* ---- the sea -------------------------------------------------- */
  #splash .sea{
    position:absolute; left:0; right:0; bottom:0;
    width:200%; height:46vh; min-height:260px;
    /* 2400 user units across 200% of the viewport, so 1200 units is
       exactly one viewport: a layer can slide by 1200 and land back on
       itself. That is what makes the loop seamless instead of jumping. */
  }
  #splash .sea use{ fill:currentColor; }
  #splash .l1{ color:var(--slate); opacity:.10; animation:drift 26s linear infinite; }
  #splash .l2{ color:var(--red);   opacity:.09; animation:drift 19s linear infinite reverse; }
  #splash .l3{ color:var(--slate); opacity:.17; animation:drift 13s linear infinite; }
  #splash .bob{ animation:bob 9s ease-in-out infinite alternate; }
  #splash .bob2{ animation:bob 7s ease-in-out infinite alternate-reverse; }
  @keyframes drift{ from{transform:translateX(0)} to{transform:translateX(-1200px)} }
  @keyframes bob{ from{transform:translateY(0)} to{transform:translateY(-14px)} }

  /* Keeps the mark sitting on white rather than on the crest of a wave. */
  #splash .veil{
    position:absolute; inset:0;
    background:radial-gradient(52% 44% at 50% 42%,
      #fff 0%, #fff 46%, rgba(255,255,255,.72) 68%, rgba(255,255,255,0) 100%);
  }

  /* ---- the brand ------------------------------------------------ */
  #splash .brand{
    position:relative; text-align:center; padding:0 24px;
    animation:rise .7s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }

  /* The real stacked lockup, at the proportions the artwork itself uses:
     the mark is 34.6% of the wordmark's width and sits 6.2% of that width
     above it. Sizing the WORDMARK and deriving the mark from it - rather than
     the other way round - is what keeps the lockup on screen at 380px wide,
     where the mark-first version would have run the wordmark off both edges. */
  #splash .lockup{ width:min(370px,76vw); margin:0 auto; }
  #splash .mark{ display:block; width:34.6%; height:auto; margin:0 auto;
                 fill:var(--red); }
  #splash .word{ display:block; width:100%; height:auto; margin:6.2% 0 0;
                 fill:var(--slate); }
  #splash .sub{
    margin:26px 0 0;
    font-size:clamp(10px,2.4vw,12px); font-weight:400;
    letter-spacing:.24em; text-indent:.24em; text-transform:uppercase;
    color:var(--slate); opacity:.72;
  }
  #splash .bar{
    margin:30px auto 0; width:min(190px,42vw); height:2px;
    background:rgba(101,118,142,.18); overflow:hidden; border-radius:2px;
  }
  #splash .bar i{
    display:block; width:40%; height:100%; border-radius:2px;
    background:var(--red); animation:sweep 1.25s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{transform:translateX(-110%)} 100%{transform:translateX(360%)}
  }

  /* Motion is decoration here - the landing has to work without it. */
  @media (prefers-reduced-motion:reduce){
    #splash .l1,#splash .l2,#splash .l3,
    #splash .bob,#splash .bob2,
    #splash .brand,#splash .bar i{ animation:none; }
    #splash .bar i{ width:100%; }
  }
</style>

<!-- Theme before first paint, so a dark-mode reader never sees a light flash.
     Inline by necessity: an external file cannot run early enough. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("gp1.theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
    document.documentElement.className += " splash-on";
  })();
</script>

<script>
/* The landing is a cover, not a gate. It comes down the moment the register
   says it is ready, and comes down anyway if the register never says so -
   a splash that outlives its page is worse than no splash.

   HOLD_MS exists because a cached load renders in well under a tenth of a
   second, and a brand that appears and vanishes inside 80ms reads as a glitch
   rather than as a landing. It is the one deliberately slow thing here. */
(function () {
  var HOLD_MS = 900, FAILSAFE_MS = 6000, FADE_MS = 500;
  var splash = document.getElementById("splash");
  var began = Date.now(), gone = false;

  /* ?hold pins the landing open. It exists because a thing that removes
     itself cannot be measured: __probe_landing.html needs it to read the
     layout, and it is the only way to look at this by hand for more than a
     second. Nothing reaches it by accident. */
  if (/[?&]hold\b/.test(location.search)) return;

  function drop() {
    if (gone) return;
    gone = true;
    var wait = Math.max(0, HOLD_MS - (Date.now() - began));
    setTimeout(function () {
      splash.classList.add("done");
      document.documentElement.className =
        document.documentElement.className.replace(/\bsplash-on\b/, "");
      setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, FADE_MS);
    }, wait);
  }

  document.addEventListener("gp1:ready", drop);
  setTimeout(drop, FAILSAFE_MS);
  /* Nobody should be made to watch this. */
  addEventListener("keydown", drop, { once: true });
  splash.addEventListener("click", drop);
})();
