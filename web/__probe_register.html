<!doctype html><meta charset="utf-8"><title>Register probe</title>
<style>html,body{margin:0}iframe{border:0;display:block;width:100%;height:1100px}</style>
<iframe id="f" src="./index.html?hold=0"></iframe>
<script>
var W=parseInt((/[?&]w=(\d+)/.exec(location.search)||[,1400])[1],10);
var T=(/[?&]t=(\w+)/.exec(location.search)||[,"light"])[1];
var OPEN=/[?&]open=1/.test(location.search);
var f=document.getElementById("f");f.style.width=W+"px";
f.addEventListener("load",function(){
  var d=f.contentDocument;
  var tick=setInterval(function(){
    if(!d.querySelector(".card"))return;
    clearInterval(tick);
    d.documentElement.setAttribute("data-theme",T);
    var sp=d.getElementById("splash"); if(sp)sp.remove();
    d.documentElement.classList.remove("splash-on");
    /* ?st=1 seeds one of every approval state onto the first items, so the
       hue ramp can be looked at without a Supabase project behind it. */
    if(/[?&]st=1/.test(location.search)){
      var W=f.contentWindow, its=W.GP1.items(), m={};
      var S=["submitted","approved","approved_as_noted","revise_resubmit","rejected"];
      for(var i=0;i<S.length&&i<its.length;i++){
        m[its[i].key]={status:S[i],status_note:S[i]==="approved_as_noted"?"Finish to be confirmed":""};
      }
      W.GP1.setApproval(m);
    }
    if(OPEN){ var c=d.querySelector(".card.act")||d.querySelector(".card"); c.click(); }
  },30);
});
</script>
