<!doctype html>
<meta charset="utf-8">
<title>Links page behaviour</title>
<!--
  Drives /links signed out, which is the state that matters most: the page has
  to stay usable for somebody with no session, because the one thing it must
  never do again is take the fields away on the word of a probe.

    python -m http.server   (from web/)   then open this file
-->
<style>
 body{font:14px/1.6 ui-monospace,Menlo,monospace;margin:24px;max-width:900px}
 .pass{color:#1F6B44}.fail{color:#9A2F2C;font-weight:700}
 iframe{position:absolute;left:-9999px;width:1200px;height:900px;border:0}
</style>
<h1 id="h">running…</h1>
<div id="o"></div>
<script>
var R = [];
function t(n, ok, d) {
  R.push([n, ok]);
  document.getElementById("o").insertAdjacentHTML("beforeend",
    '<div class="' + (ok ? "pass" : "fail") + '">' + (ok ? "PASS " : "FAIL ") +
    n + (ok ? "" : "   [" + String(d).slice(0, 80) + "]") + "</div>");
}

/* The page shares this origin's localStorage with the real thing, so the
   probe must not leave its typing behind in it. */
var KEY = "gp1.links.v1", was = null;
try { was = localStorage.getItem(KEY); localStorage.removeItem(KEY); } catch (e) {}

var f = document.createElement("iframe");
f.src = "./links.html";
document.body.appendChild(f);

f.addEventListener("load", function () {
  var d = f.contentDocument, w = f.contentWindow, n = 0;
  var tick = setInterval(function () {
    /* wait for the rows AND for the database read to have reported */
    var done = d.querySelector("#diaglist") &&
               /still outstanding/.test(d.getElementById("diaglist").textContent);
    if ((!d.querySelector(".row") || !done) && ++n < 250) return;
    clearInterval(tick);
    /* Ask the same two sources the page asked, independently, so the probe is
       checking the RULE rather than trusting the page's own bookkeeping. */
    var cfg = w.GP1_CONFIG || {};
    Promise.all([
      fetch("./data/datasheets.json").then(function (x) { return x.json(); }),
      fetch(cfg.url + "/rest/v1/maker_link_public?select=item_key,url",
            { headers: { apikey: cfg.anonKey, Authorization: "Bearer " + cfg.anonKey,
                         "Accept-Profile": "gp1" } }).then(function (x) { return x.json(); })
    ]).then(function (both) {
      var live = {};
      (both[0].items || []).forEach(function (it) { live[it.key] = true; });
      var have = {};
      (both[0].items || []).forEach(function (it) { if (it.maker_url) have[it.key] = it.maker_url; });
      /* A saved link whose item no longer exists is not a linked item. Three
         point at retired H keys, and counting them made the arithmetic say
         three rows too many were on the list. */
      (both[1] || []).forEach(function (r) { if (live[r.item_key]) have[r.item_key] = r.url; });
      w.__probeLinks = have;
      w.__probeItems = (both[0].items || []).length;
      setTimeout(function () { run(d, w); }, 200);
    }, function (e) {
      w.__probeLinks = null;
      setTimeout(function () { run(d, w); }, 200);
    });
  }, 40);
});

function run(d, w) {
  var rows = d.querySelectorAll(".row");
  var diag0 = d.getElementById("diaglist").textContent;

  /* THE LIST IS WORKED OUT, NOT BAKED. The count is whatever is true today,
     so the assertion is about the rule, not the number: every row shown has a
     link in neither the catalogue nor the table, and nothing with one appears.
     That is what makes this page need nobody to rebuild it. */
  t("it shows some outstanding work", rows.length > 0, rows.length);
  t("it read the catalogue, not a baked-in list", /read the register . yes/i.test(diag0),
    diag0.slice(0, 120));

  var keys = [], i;
  for (i = 0; i < rows.length; i++) keys.push(rows[i].getAttribute("data-key"));
  var withLink = w.__probeLinks;
  t("the probe could check the sources itself", !!withLink, "fetch failed");
  if (withLink) {
    var wrong = keys.filter(function (k) { return withLink[k]; });
    t("every row shown really has a link in neither source",
      wrong.length === 0, wrong.slice(0, 4).join(","));
    /* The other direction, which is the one the user asked for: nothing with
       a link may appear. Counting proves none was missed, not just that the
       ones on screen happen to be right. */
    t("and nothing with a link was left on the list",
      rows.length === w.__probeItems - Object.keys(withLink).length,
      rows.length + " shown, " + w.__probeItems + " items, " +
      Object.keys(withLink).length + " linked");
  }
  t("and the count matches what it reported",
    diag0.indexOf(rows.length + " of ") > -1, diag0.slice(-100));
  t("grouped by manufacturer", d.querySelectorAll("section.maker").length > 2,
    d.querySelectorAll("section.maker").length);

  /* Every row carries its datasheet. Confirming a product page means knowing
     which product it is. */
  /* Every row that HAS a datasheet shows it. The eleven new Dornbracht
     items have no Drive link yet - their PDFs are not uploaded - so an
     assertion that every row carries one would be asserting the upload, not
     the page. */
  var withDs = d.querySelectorAll(".ttl a.ds").length;
  t("no row claims a datasheet it does not have", withDs <= rows.length, withDs);
  t("most rows do link one", withDs > 0, withDs + " of " + rows.length);

  var diag = d.getElementById("diaglist").textContent;
  t("it connected to the register database", /connected . yes/i.test(diag), diag.slice(0, 90));
  t("and read the saved links signed out", /read the saved links . yes/i.test(diag),
    diag.slice(0, 160));
  t("the links already confirmed came back",
    / already confirmed/.test(diag), diag.slice(0, 170));

  /* THE FIELDS ARE NEVER TAKEN AWAY. Locking them was the wrong call once and
     turned "saving may fail" into "you cannot work". */
  var locked = 0, inputs = d.querySelectorAll("input.url");
  for (var i = 0; i < inputs.length; i++) if (inputs[i].disabled || inputs[i].readOnly) locked++;
  t("no field is disabled when signed out", locked === 0, locked);
  t("it says where to sign in", !d.getElementById("who").hidden &&
    /sign in/i.test(d.getElementById("who").textContent),
    d.getElementById("who").textContent.slice(0, 70));

  /* Typing is kept immediately, with no database and no session. */
  var first = inputs[0];
  first.value = "https://example.com/probe-typed";
  first.dispatchEvent(new w.Event("input", { bubbles: true }));
  var held = null;
  try { held = JSON.parse(w.localStorage.getItem("gp1.links.v1") || "{}"); } catch (e) {}
  var key = rows[0].getAttribute("data-key");
  t("a keystroke is kept in this browser at once",
    !!held && held[key] === "https://example.com/probe-typed", JSON.stringify(held).slice(0, 80));
  t("and the row says so, not 'saved'",
    rows[0].classList.contains("local"), rows[0].className);

  /* A bad value is refused as a URL but never thrown away. */
  first.value = "not a url";
  first.dispatchEvent(new w.Event("input", { bubbles: true }));
  t("a non-URL is flagged, not discarded",
    rows[0].classList.contains("bad") && first.value === "not a url", rows[0].className);

  /* Use this fills from the guess without pretending it is an answer. */
  first.value = "";
  first.dispatchEvent(new w.Event("input", { bubbles: true }));
  /* A row only offers Use this when there is a guess to take, and whether
     row zero has one depends on which items are outstanding today. Find one
     that does. */
  var gRow = null;
  for (var gi = 0; gi < rows.length; gi++) {
    if (rows[gi].querySelector("button.use:not([hidden])")) { gRow = rows[gi]; break; }
  }
  t("some row offers a guess", !!gRow);
  if (gRow) {
    var gInp = gRow.querySelector("input.url");
    var guess = gInp.placeholder;
    gRow.querySelector("button.use").click();
    t("Use this takes the guess", gInp.value === guess, gInp.value + " vs " + guess);
  }

  /* The way out that cannot be refused. */
  var n0 = d.querySelectorAll("input.url").length;
  d.getElementById("useall").click();
  var filled = 0;
  d.querySelectorAll("input.url").forEach(function (x) { if (x.value.trim()) filled++; });
  t("Use every guess fills the rows that have one", filled > 0, filled + " of " + n0);
  t("the tally agrees with the list",
    d.getElementById("strip").textContent.indexOf("of " + n0) > -1,
    d.getElementById("strip").textContent.slice(0, 70));

  try { w.localStorage.removeItem("gp1.links.v1"); } catch (e) {}
  try { if (was === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, was); } catch (e) {}

  var bad = R.filter(function (r) { return !r[1]; }).length;
  document.getElementById("h").textContent =
    bad ? bad + " FAILED of " + R.length : "all " + R.length + " passed";
  document.title = bad ? "R:FAIL " + bad : "R:PASS " + R.length;
}
</script>
