<link rel="stylesheet" href="./assets/styles.css">

<!-- Theme before first paint, so a dark-mode reader never sees a light flash.
     Inline by necessity: an external file cannot run early enough. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("gp1.theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<!-- This page is the older, wider procurement schedule. It is kept because it
     is the only record of the other twelve trades, and linked from the register
     rather than deleted. -->
<div id="archive-note" role="note">
  <span><b>Archive.</b> The full 199-item procurement schedule, across 13 trades.
    The current register is the curated datasheet library.</span>
  <a href="./">Material &amp; Hardware Register &rarr;</a>
</div>
<style>
  #archive-note{
    display:flex; gap:14px; align-items:center; flex-wrap:wrap;
    padding:10px clamp(16px,3vw,32px);
    background:#65768E; color:#fff;
    font:400 13px/1.5 "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  }
  #archive-note b{font-weight:600}
  #archive-note a{color:#fff; margin-left:auto; font-weight:500}
</style>

<a class="skip" href="#results">Skip to the register</a>

<!-- The whole page is rendered by app.js. This is only the mount point, so
     there is exactly one description of the markup and it lives in the code. -->
<div id="root"></div>

<noscript>
  <div style="max-width:640px;margin:48px auto;padding:0 22px;font-family:system-ui,sans-serif">

      <a href="./data/seed.json">seed.json</a>.</p>
  </div>
</noscript>

<script src="./assets/config.js"></script>

<script src="./assets/app.js"></script>
</body>
</html>
