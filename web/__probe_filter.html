<!doctype html>
<meta charset="utf-8">
<title>Filter behaviour</title>
<!--
  Drives the facet bar against the real register.

  The point of these is the combining rules, which are the easiest thing to
  get quietly wrong: values inside one facet are OR, facets against each other
  are AND, and a facet's own counts ignore its own selection so it can still
  say what else you could pick.

    python -m http.server   (from web/)   then open this file
-->
<style>
 body{font:14px/1.6 ui-monospace,Menlo,monospace;margin:24px;max-width:900px}
 .pass{color:#1F6B44}.fail{color:#9A2F2C;font-weight:700}
 iframe{position:absolute;left:-9999px;width:1400px;height:900px;border:0}
</style>
<h1 id="h">running…</h1>
<div id="o"></div>
<script>
var R = [], f = document.createElement("iframe");
function t(n, ok, d) {
  R.push([n, ok, d]);
  document.getElementById("o").insertAdjacentHTML("beforeend",
    '<div class="' + (ok ? "pass" : "fail") + '">' + (ok ? "PASS " : "FAIL ") +
    n + (ok ? "" : "   [" + String(d).slice(0, 70) + "]") + "</div>");
}
f.src = "./__probe_register.html?st=1&w=1400";
document.body.appendChild(f);

f.addEventListener("load", function () {
  var outer = f.contentDocument, n = 0;
  var tick = setInterval(function () {
    var inner = outer.getElementById("f");
    var d = inner && inner.contentDocument;
    if ((!d || !d.querySelector("#facets .facet")) && ++n < 250) return;
    clearInterval(tick);
    setTimeout(function () { run(d, inner.contentWindow); }, 400);
  }, 40);
});

function run(d, w) {
  var cards = function () { return d.querySelectorAll(".card").length; };
  var facet = function (k) { return d.querySelector('[data-facet="' + k + '"]'); };
  var btn = function (k) { return facet(k).querySelector(".fbtn"); };
  var opts = function (k) { return facet(k).querySelectorAll(".fopt"); };
  var pick = function (k, v) {
    var all = opts(k);
    for (var i = 0; i < all.length; i++) {
      if (all[i].querySelector("input").value === v) {
        all[i].querySelector("input").click();
        return true;
      }
    }
    return false;
  };
  var pills = function () { return d.querySelectorAll("#showing .pill").length; };

  /* This probe loads the REAL index.html, so workflow.js has already read the
     real database and the five LedFlex profiles arrive flagged. Start from a
     known empty state instead: the absent case is one of the things under
     test, and it cannot be asserted against data somebody may change. */
  w.GP1.setDiscontinued({});
  var total = cards();

  t("the register loaded", total === 147, total);
  t("four facets", d.querySelectorAll("#facets .facet").length === 4);
  t("Showing is absent until something is filtered",
    d.getElementById("showing").hidden);

  /* ---- opening and closing ---- */
  btn("discipline").click();
  t("a facet opens", !!facet("discipline").querySelector(".pop"));
  t("it reports open to assistive tech",
    btn("discipline").getAttribute("aria-expanded") === "true");
  d.body.click();
  t("clicking away closes it", !facet("discipline").querySelector(".pop"));

  /* ---- one value ---- */
  btn("discipline").click();
  var disc = opts("discipline").length;
  t("disciplines are listed", disc === 6, disc);
  pick("discipline", "Lighting");
  var lit = cards();
  t("Lighting narrows the list", lit === 74, lit);
  t("and names itself in Showing", pills() === 1, pills());

  /* ---- OR inside a facet ---- */
  pick("discipline", "Doors");
  var both = cards();
  t("adding Doors widens it (OR within a facet)", both === 84, both);
  t("two pills now", pills() === 2, pills());
  pick("discipline", "Doors");
  t("unticking Doors puts it back", cards() === lit, cards());
  d.body.click();

  /* ---- counts ignore their own facet, and respect the others ---- */
  btn("maker").click();
  var makers = opts("maker").length;
  var sum = 0, zero = 0;
  opts("maker").forEach(function (o) {
    var c = Number(o.querySelector("b").textContent);
    sum += c; if (!c) zero++;
  });
  t("the Maker list is narrowed by Lighting", makers < 36 && makers > 0, makers);
  t("no maker offers zero items", zero === 0, zero);
  var mk = opts("maker")[0].querySelector("input").value;
  var mkCount = Number(opts("maker")[0].querySelector("b").textContent);
  opts("maker")[0].querySelector("input").click();

  /* ---- AND between facets ---- */
  var andCount = cards();
  t("a maker AND a discipline narrows further", andCount === mkCount, andCount + " vs " + mkCount);
  /* Two, not three: Doors was ticked and unticked again above. */
  t("two pills - the discipline and the maker", pills() === 2, pills());
  d.body.click();

  /* ---- the counts a facet shows about itself ignore its own picks ---- */
  btn("maker").click();
  t("the Maker list still offers every maker it did",
    opts("maker").length === makers, opts("maker").length + " vs " + makers);
  d.body.click();

  /* ---- dropping one, and dropping all ---- */
  d.querySelectorAll("#showing .pill")[1].click();
  t("dropping the maker pill restores the discipline result",
    cards() === lit, cards());
  d.querySelector("#showing .clearall").click();
  t("Clear all restores everything", cards() === total, cards());
  t("and takes the Showing row away", d.getElementById("showing").hidden);

  /* ---- Flags ----

     A facet that exists only when something carries the flag. The absent case
     is the one worth asserting: a button that opens onto an empty list is a
     control that lies about having something to offer. */
  t("no Flags facet while nothing is flagged", !facet("flag"));

  var GONE = ["lum-lum3.3", "lum-lum4.3", "lum-lum5.2", "lum-lum6.2", "lum-lum9.2"];
  var m = {};
  GONE.forEach(function (k) {
    m[k] = { note: "Archived by the maker", at: "2026-09-30T09:00:00Z",
             author: "the register build" };
  });
  w.GP1.setDiscontinued(m);

  t("the Flags facet appears once something is flagged", !!facet("flag"));
  t("five facets now", d.querySelectorAll("#facets .facet").length === 5,
    d.querySelectorAll("#facets .facet").length);
  t("five cards turn red", d.querySelectorAll(".card.disco").length === 5,
    d.querySelectorAll(".card.disco").length);
  t("each carries the chip", d.querySelectorAll(".card.disco .st-disco").length === 5,
    d.querySelectorAll(".card.disco .st-disco").length);
  t("the rest of the register is untouched", cards() === total, cards());

  btn("flag").click();
  t("Flags offers exactly one value", opts("flag").length === 1, opts("flag").length);
  t("and counts the five", Number(opts("flag")[0].querySelector("b").textContent) === 5,
    opts("flag")[0].querySelector("b").textContent);
  pick("flag", "discontinued");
  t("Flags narrows to the five", cards() === 5, cards());
  t("and says Discontinued in Showing",
    /Discontinued/.test(d.getElementById("showing").textContent),
    d.getElementById("showing").textContent.slice(0, 60));
  d.body.click();

  /* AND, like every other facet. All five are LedFlex, so the count holds -
     and a maker that does NOT make them empties the list. */
  btn("maker").click();
  t("Maker now offers only the makers of flagged items",
    opts("maker").length === 1, opts("maker").length);
  d.body.click();

  d.querySelector("#showing .clearall").click();
  t("Clear all drops the flag too", cards() === total, cards());

  /* Un-flagging takes the control away with it, rather than leaving a button
     that opens onto nothing. */
  w.GP1.setDiscontinued({});
  t("the Flags facet goes when the last flag does", !facet("flag"));
  t("and the cards go back to normal", d.querySelectorAll(".card.disco").length === 0);
  w.GP1.setDiscontinued(m);

  /* ---- what the register remembers, and what a link reaches ---- */

  /* #30: the filters are written through on every change, so a reload lands
     where you left it. Asserted against localStorage rather than a reload,
     which the iframe cannot do without losing the handle on it. */
  btn("discipline").click();
  pick("discipline", "Doors");
  d.body.click();
  var saved = null;
  try { saved = JSON.parse(w.localStorage.getItem("gp1.filters.v1") || "null"); } catch (e) {}
  t("the filters are remembered", !!(saved && saved.f && saved.f.discipline &&
    saved.f.discipline.indexOf("Doors") > -1), JSON.stringify(saved));
  d.querySelector("#showing .clearall").click();
  var after = null;
  try { after = w.localStorage.getItem("gp1.filters.v1"); } catch (e) {}
  t("and clearing them forgets, rather than saving an empty shape", !after, after);

  /* #40: the empty state names what is on instead of saying nothing matches.
     Two facets that cannot both be true gets there. */
  btn("discipline").click(); pick("discipline", "Doors"); d.body.click();
  var q2 = d.getElementById("q");
  q2.value = "pentair";
  q2.dispatchEvent(new w.Event("input", { bubbles: true }));
  t("an impossible combination empties the list", cards() === 0, cards());
  var drops = d.querySelectorAll("[data-dropall]");
  var which = [];
  for (var di = 0; di < drops.length; di++) which.push(drops[di].getAttribute("data-dropall"));
  /* One button per filter that is actually on, whatever that number is - the
     probe reads the state rather than hardcoding a count, so it keeps telling
     the truth when a facet is added. */
  t("the empty state offers each filter separately",
    drops.length === 2 && which.indexOf("q") > -1 &&
    which.indexOf("discipline") > -1, which.join(","));
  t("one of them is the search", !!d.querySelector('[data-drop="q"]'));
  d.querySelector('[data-dropall="q"]').click();
  t("dropping the search alone brings the rest back", cards() > 0, cards());

  /* THE REGRESSION THIS FOUND. A Showing pill carries data-drop plus a
     data-v and means "drop this one value"; the empty-state buttons mean
     "drop the whole facet". They shared an attribute for about an hour, and
     with one value selected the two are indistinguishable - so this picks
     TWO disciplines and checks the pill takes only its own. */
  /* From a clean start: the discipline from the empty-state test above is
     still on, and an assertion that counts pills has to know what it began
     with. */
  var ca = d.querySelector("#showing .clearall");
  if (ca) ca.click();
  btn("discipline").click();
  pick("discipline", "Pool");
  pick("discipline", "Site");
  d.body.click();
  var two = cards();
  t("two disciplines are on", pills() === 2, pills());
  d.querySelectorAll("#showing .pill")[1].click();
  t("a pill drops its own value and leaves the other", pills() === 1 && cards() < two,
    pills() + " pills, " + cards() + " cards, was " + two);
  d.querySelector("#showing .clearall").click();

  /* #35: the jump control lists only groups with something in them. */
  var jump = d.getElementById("jump");
  t("the jump control lists every group", jump.options.length === 16, jump.options.length);
  btn("discipline").click(); pick("discipline", "Site"); d.body.click();
  t("and narrows with the filters", jump.options.length === 2, jump.options.length);
  d.querySelector("#showing .clearall").click();

  /* ---- search joins in ---- */
  var q = d.getElementById("q");
  q.value = "pentair";
  q.dispatchEvent(new w.Event("input", { bubbles: true }));
  t("search filters", cards() < total && cards() > 0, cards());
  t("and appears as a pill", pills() === 1, pills());
  d.querySelector("#showing .pill").click();
  t("dropping the search pill clears the box", q.value === "" && cards() === total);

  var bad = R.filter(function (r) { return !r[1]; }).length;
  document.getElementById("h").textContent =
    bad ? bad + " FAILED of " + R.length : "all " + R.length + " passed";
  document.title = bad ? "R:FAIL " + bad : "R:PASS " + R.length;
}
</script>
