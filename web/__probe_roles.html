<!doctype html>
<meta charset="utf-8">
<title>Role matrix</title>
<!--
  Drives __probe_workflow.html once per role and checks that each one sees
  exactly the controls its role allows - the permission matrix in the
  migration header, asserted against the page rather than trusted.

  The database is the thing that actually enforces this; these checks are
  about the SECOND failure, which is a page that offers a control the
  database will refuse. Somebody clicking Attach and being told "permission
  denied" is a bug even though nothing unsafe happened.

    python tools/probe_workflow.py      # regenerate first - it reads index.html
    open __probe_roles.html
-->
<style>
 body{font:14px/1.6 ui-monospace,Menlo,monospace;margin:24px;max-width:900px}
 .pass{color:#1F6B44}.fail{color:#9A2F2C;font-weight:700}
 iframe{position:absolute;left:-9999px;width:1200px;height:900px;border:0}
 h2{font-size:14px;margin:18px 0 4px}
</style>
<h1 id="h">running…</h1>
<div id="o"></div>
<script>
/* what each role must and must not be offered */
var CASES = [
  {role:"out", want:{auth:"Sign in", pills:true, status:"read", notes:true,
                     addNote:false, invoices:false, prompt:true, pic:false, disco:false, tools:false}},
  {role:"none", want:{auth:"me", pills:true, status:"read", notes:true,
                      addNote:false, invoices:false, prompt:false, pic:false, disco:false, tools:false}},
  {role:"viewer", want:{auth:"me", pills:true, status:"read", notes:true,
                        addNote:false, invoices:false, prompt:false, pic:false, disco:false, tools:false}},
  {role:"commenter", want:{auth:"me", pills:true, status:"read", notes:true,
                           addNote:true, invoices:false, prompt:false, pic:false, disco:false, tools:false}},
  {role:"admin", want:{auth:"me", pills:true, status:"edit", notes:true,
                       addNote:true, invoices:false, prompt:false, pic:true, disco:true, tools:false}},
  /* Same role, plus the flag: the only difference is the invoices. */
  {role:"admin", money:1, want:{auth:"me", pills:true, status:"edit", notes:true,
                       addNote:true, invoices:true, prompt:false, pic:true, disco:true, tools:false}},
  {role:"super_admin", want:{auth:"me", pills:true, status:"edit", notes:true,
                             addNote:true, invoices:false, prompt:false, pic:true, disco:true, tools:true}}
];

var out = document.getElementById("o"), fails = 0, done = 0;

function check(c, d, w) {
  var r = [];
  function t(n, ok) { r.push([n, ok]); if (!ok) fails++; }

  var auth = d.getElementById("auth");
  t("auth control", c.want.auth === "Sign in"
      ? !!auth.querySelector(".auth-in")
      : !!auth.querySelector(".auth-me"));
  /* The two review tools hang off the account menu for a super admin only.
     Cosmetic, not protection - the pages are public and the boundary is the
     write policy - but a viewer being shown an admin's tools reads as an
     invitation, and that is worth asserting either way. */
  var tools = auth.querySelectorAll('.auth-menu a[href*="certification"], .auth-menu a[href*="links"]');
  t("tool links " + (c.want.tools ? "offered" : "withheld"),
    (tools.length === 2) === !!c.want.tools, tools.length);
  t("status pills on cards", (d.querySelectorAll(".card .st").length > 0) === c.want.pills);

  var wf = d.querySelector(".wf");
  t("panel present", !!wf);
  if (wf) {
    var sel = wf.querySelector(".wf-status select");
    t("status is " + c.want.status,
      c.want.status === "edit" ? !!sel : !sel && !!wf.querySelector(".wf-read"));
    t("notes " + (c.want.notes ? "shown" : "hidden"),
      !!wf.querySelector(".wf-notes") === c.want.notes);
    t("add-note " + (c.want.addNote ? "offered" : "withheld"),
      !!wf.querySelector(".wf-add textarea") === c.want.addNote);
    t("invoices " + (c.want.invoices ? "shown" : "hidden"),
      !!wf.querySelector(".wf-inv") === c.want.invoices);
    /* Whoever may move an item's status and read its invoices may also fix
       its picture - the more consequential powers are already theirs, and a
       wrong picture is the most visible and most reversible kind of mistake. */
    t("replace-picture " + (c.want.pic ? "offered" : "withheld"),
      !!wf.querySelector(".wf-pic") === !!c.want.pic);
    /* Same rung as the picture, and for the same reason: it is the people who
       already move an item's status who will notice a product has gone. */
    t("discontinued control " + (c.want.disco ? "offered" : "withheld"),
      !!wf.querySelector(".wf-disco") === !!c.want.disco);
    /* It sits ABOVE the status, so nobody scrolls past the reason the status
       may no longer matter. */
    if (c.want.disco) {
      var secs = wf.querySelectorAll(".wf-sec");
      t("discontinued comes before the status",
        secs.length > 1 && secs[0].querySelector(".wf-disco") !== null);
    }
    t("sign-in prompt " + (c.want.prompt ? "shown" : "absent"),
      !!wf.querySelector("[data-signin]") === c.want.prompt);
  }
  /* The word must not be in the DOM at all for somebody who cannot open one.
     Checking the text rather than a selector is the point: this catches a
     prompt that mentions invoices as readily as a section that renders one. */
  if (!c.want.invoices) {
    t("the word invoice appears nowhere",
      !/invoice/i.test((d.querySelector(".sheet") || d.body).textContent || ""));
  }
  /* THE BANNER IS FOR EVERYONE. a-a1 is seeded as discontinued and is the
     card ?open=1 opens, so this asserts on every role including signed-out -
     which is the whole point of reading it from a public view. */
  var sheet = d.querySelector(".sheet");
  t("discontinued banner on the sheet", !!(sheet && sheet.querySelector(".sheet-alert")));
  t("banner sits above the picture", !!(sheet && (function () {
    var b = sheet.querySelector(".sheet-b");
    return b && b.firstElementChild && b.firstElementChild.className === "sheet-alert";
  })()));
  t("red card in the grid", !!d.querySelector(".card.disco"));
  /* Approved AND discontinued: a-a2 carries both, and one must not hide the
     other. This is the case the whole feature exists for. */
  t("approved and discontinued show together", !!(function () {
    var c2 = d.querySelectorAll(".card.disco");
    for (var i = 0; i < c2.length; i++) {
      if (c2[i].querySelector(".st-disco") && c2[i].querySelector(".st-approved")) return true;
    }
    return false;
  })());

  if (c.role === "none") {
    t("told why they cannot do anything",
      !!d.querySelector(".auth-warn") || !!d.querySelector(".auth-menu"));
  }

  var h = "<h2>" + c.role + (c.money ? " + commercial" : "") + "</h2>";
  for (var i = 0; i < r.length; i++) {
    h += '<div class="' + (r[i][1] ? "pass" : "fail") + '">' +
         (r[i][1] ? "PASS " : "FAIL ") + r[i][0] + "</div>";
  }
  out.insertAdjacentHTML("beforeend", h);
  if (++done === CASES.length) {
    document.getElementById("h").textContent =
      fails ? fails + " FAILED" : "all passed";
    document.title = fails ? "R:FAIL " + fails : "R:PASS all";
  }
}

CASES.forEach(function (c) {
  var f = document.createElement("iframe");
  f.src = "./__probe_workflow.html?role=" + c.role + "&open=1" +
          (c.money ? "&money=1" : "");
  f.addEventListener("load", function () {
    var d = f.contentDocument, n = 0;
    var tick = setInterval(function () {
      /* wait for the sheet AND its async panel fills */
      if ((!d.querySelector(".wf") || !d.querySelector(".wf-sec")) && ++n < 120) return;
      clearInterval(tick);
      setTimeout(function () { check(c, d, f.contentWindow); }, 500);
    }, 40);
  });
  document.body.appendChild(f);
});
</script>
